<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>市場さま向け 価格・在庫・見積ツール｜林材木店</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f7f9fc; --ink:#2a3340; --sub:#7a869a;
    --line:#e3e8ef; --line2:#cfd8e3; --brand:#2f6f4f; --brand2:#3a8a63; --accent:#1d4e89;
    --ichi:#1d4e89; --tsuke:#b06a1f;
    --ok:#2e7d4f; --warn:#c98a1e; --ng:#b0483a;
    --shadow:0 1px 3px rgba(30,40,60,.08),0 3px 14px rgba(30,40,60,.05);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 14px 120px; }

  header.top{ background:linear-gradient(120deg,#274b73,#1d4e89); color:#fff; padding:16px 16px 14px; }
  header.top .in{ max-width:1080px; margin:0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header.top h1{ font-size:18px; margin:0; font-weight:800; letter-spacing:.02em; }
  header.top .sub{ font-size:12px; opacity:.85; }
  header.top .who{ margin-left:auto; font-size:12px; opacity:.9; display:flex; gap:10px; align-items:center; }
  header.top .who button{ background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; box-shadow:var(--shadow); }
  .card h2{ font-size:16px; margin:0 0 3px; display:flex; align-items:center; gap:8px; }
  .card h2 .badge{ font-size:11px; font-weight:700; color:#fff; background:var(--brand); border-radius:20px; padding:2px 9px; }
  .card .h2sub{ font-size:12px; color:var(--sub); margin:0 0 14px; }

  .seg{ display:inline-flex; border:1.5px solid var(--line2); border-radius:10px; overflow:hidden; background:#fff; }
  .seg button{ border:none; background:transparent; color:var(--sub); font-family:inherit; font-size:13.5px; font-weight:700; padding:8px 20px; cursor:pointer; }
  .seg button.on{ color:#fff; }
  .seg.method button.on[data-v="市売"]{ background:var(--ichi); }
  .seg.method button.on[data-v="付売"]{ background:var(--tsuke); }
  .seg.thick button.on{ background:#556; }
  .toolbar{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .lbl{ font-size:12.5px; font-weight:700; color:var(--sub); }
  .method-hint{ font-size:12px; color:var(--sub); }
  .method-hint b.ichi{ color:var(--ichi); } .method-hint b.tsuke{ color:var(--tsuke); }
  .method-fixed{ font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
  .method-fixed .mfx-lbl{ font-size:11px; font-weight:700; color:#fff; border-radius:20px; padding:2px 10px; }
  .method-fixed .mfx-lbl.ichi{ background:var(--ichi); } .method-fixed .mfx-lbl.tsuke{ background:var(--tsuke); }

  .tscroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; }
  table.grid{ width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; min-width:600px; }
  table.grid th, table.grid td{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 7px; text-align:center; white-space:nowrap; }
  table.grid tr th:last-child, table.grid tr td:last-child{ border-right:none; }
  table.grid tr:last-child td, table.grid tr:last-child th{ border-bottom:none; }
  table.grid thead th{ background:#e8eef6; font-size:12px; color:#2a3340; font-weight:700; border-bottom:2px solid var(--line2); }
  /* tbody ゼブラ縞（行に色付け→背景を持つ td/th が上書きするので pcell:hover と .na が優先される） */
  table.grid tbody tr:nth-child(odd){ background:#ffffff; }
  table.grid tbody tr:nth-child(even){ background:#f5f8fb; }
  table.grid tbody th{ background:#eef2f7; font-weight:700; text-align:left; padding-left:12px; color:#2a3340; }
  table.grid tbody th small{ display:block; font-size:10px; color:var(--sub); font-weight:500; }
  .ptype{ font-size:13.5px; font-weight:800; color:var(--ink); margin:14px 0 7px; display:flex; align-items:center; gap:10px; }
  .ptype:first-child{ margin-top:0; }
  .ptype .tag{ font-size:11px; font-weight:600; color:var(--sub); background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:1px 7px; }

  .pcell{ cursor:pointer; transition:background .1s; }
  .pcell:hover{ background:#eef6f0; }
  .pcell .num{ font-weight:700; font-size:14.5px; }
  .pcell .add{ display:block; font-size:10px; color:var(--brand); font-weight:700; opacity:0; }
  .pcell:hover .add{ opacity:1; }
  .pcell.na{ color:#c3ccd8; cursor:default; background:#fafbfc; }
  .pcell.na:hover{ background:#fafbfc; }

  /* 在庫グリッド */
  .stk-cell{ font-weight:700; }
  .stk-o{ color:var(--ok); } .stk-a{ color:var(--warn); } .stk-x{ color:var(--ng); } .stk-none{ color:#c3ccd8; font-weight:500; }
  .stk-cell small{ display:block; font-size:10px; font-weight:600; }
  .stk-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin-top:8px; }
  .stk-meta button{ border:1px solid var(--line2); background:#fff; border-radius:7px; padding:5px 11px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--ink); }
  .stk-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; }
  .stk-note{ font-size:11.5px; color:var(--sub); margin-top:6px; }

  /* 見積 */
  .qwrap{ display:grid; grid-template-columns:1fr; gap:0; }
  table.qt{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
  table.qt th{ background:var(--panel2); border-bottom:2px solid var(--line2); padding:8px; font-size:12px; color:var(--sub); text-align:right; }
  table.qt th.l{ text-align:left; }
  table.qt td{ border-bottom:1px solid var(--line); padding:8px; text-align:right; white-space:nowrap; }
  table.qt td.l{ text-align:left; white-space:normal; }
  table.qt .mtag{ font-size:10.5px; font-weight:700; border-radius:4px; padding:1px 6px; color:#fff; }
  table.qt .mtag.ichi{ background:var(--ichi); } table.qt .mtag.tsuke{ background:var(--tsuke); }
  table.qt input.qy{ width:60px; text-align:right; padding:6px; border:1px solid var(--line2); border-radius:7px; font-family:inherit; font-size:13.5px; }
  table.qt .del{ border:none; background:#fbeceb; color:#b0483a; border-radius:6px; padding:4px 9px; cursor:pointer; font-size:12px; font-family:inherit; }
  .q-empty{ color:var(--sub); font-size:13.5px; padding:16px; text-align:center; background:var(--panel2); border-radius:10px; }

  .q-foot{ display:grid; grid-template-columns:1.1fr .9fr; gap:20px; margin-top:16px; align-items:start; }
  @media(max-width:720px){ .q-foot{ grid-template-columns:1fr; } }
  .q-fields label{ font-size:12px; font-weight:700; color:var(--sub); display:block; margin:0 0 3px; }
  .q-fields .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .q-fields input, .q-fields select{ width:100%; padding:9px; border:1.5px solid var(--line2); border-radius:9px; font-size:14px; font-family:inherit; background:#fff; }
  .ship-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ship-row .note{ font-size:11px; color:var(--sub); }

  .sumbox{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .sumbox table{ width:100%; border-collapse:collapse; font-size:14px; }
  .sumbox th{ text-align:left; font-weight:500; color:var(--sub); padding:5px 4px; }
  .sumbox td{ text-align:right; font-weight:700; padding:5px 4px; }
  .sumbox tr.total th{ font-size:15px; color:var(--ink); font-weight:800; border-top:2px solid var(--line2); padding-top:10px; }
  .sumbox tr.total td{ font-size:22px; color:var(--brand); border-top:2px solid var(--line2); padding-top:10px; }
  .contact-block{ border:1px dashed var(--line2); border-radius:11px; padding:12px 12px 4px; margin-bottom:12px; background:#fbfcfe; }
  .cb-title{ font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:8px; }
  .ack-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; margin-bottom:10px; }
  .ack-opt{ font-size:13px !important; font-weight:600 !important; color:var(--ink) !important; display:inline-flex !important; align-items:center; gap:5px; cursor:pointer; margin:0 !important; }
  .ack-opt input{ width:auto !important; margin:0; padding:0; }
  .req{ color:#b0483a; margin-left:2px; }
  .qbtns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .qbtns button{ flex:1; min-width:140px; border:none; border-radius:10px; padding:13px 10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .qbtns.primary button{ padding:15px 10px; font-size:15px; box-shadow:0 3px 10px rgba(30,40,60,.14); }
  .b-req{ background:linear-gradient(180deg,#2f7fbf,#1d4e89); color:#fff; }
  .b-order{ background:linear-gradient(180deg,#e08a2b,#c26a12); color:#fff; }
  .b-print{ background:#fff; color:var(--brand); border:2px solid var(--brand) !important; }
  .b-save{ background:#fff; color:var(--accent); border:2px solid var(--accent) !important; }
  .q-underbtns{ display:flex; gap:10px; margin-top:10px; }
  .q-underbtns button{ flex:1; border-radius:10px; padding:10px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .b-drafts{ background:#eef2f7; color:var(--accent); border:1px solid var(--line2); }
  .b-clear{ background:#f4f6f9; color:var(--sub); border:1px solid var(--line2); }
  #save-msg{ font-size:12.5px; color:var(--brand); font-weight:700; margin-top:10px; }

  .drafts-box{ margin-top:16px; border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--panel2); }
  .db-head{ font-size:13.5px; font-weight:800; color:var(--ink); margin-bottom:10px; }
  .draft-row{ display:flex; gap:10px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .dr-main{ flex:1; min-width:0; }
  .dr-top{ display:flex; align-items:center; gap:8px; font-size:14px; }
  .dr-top b{ color:var(--brand); }
  .dr-date{ font-size:11px; color:var(--sub); margin-left:auto; }
  .dr-tag{ font-size:10.5px; font-weight:700; color:#fff; border-radius:5px; padding:1px 7px; }
  .tg-order{ background:#c26a12; } .tg-req{ background:#1d4e89; } .tg-draft{ background:#8a94a5; }
  .dr-items{ font-size:12px; color:var(--sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dr-mk{ color:var(--accent); }
  .dr-btns{ display:flex; gap:6px; flex:0 0 auto; }
  .dr-btns button{ border:1px solid var(--line2); background:#fff; border-radius:7px; padding:6px 11px; font-size:12px; cursor:pointer; font-family:inherit; }
  .dr-recall{ color:var(--accent); font-weight:700; }
  .dr-del{ color:#b0483a; }

  /* ログインゲート */
  .gate{ max-width:380px; margin:70px auto; }
  .gate .card{ padding:28px 26px; text-align:center; }
  .gate h1{ font-size:19px; margin:0 0 4px; }
  .gate p{ font-size:12.5px; color:var(--sub); margin:0 0 18px; }
  .gate input{ width:100%; padding:12px; border:2px solid var(--line2); border-radius:11px; font-size:15px; text-align:center; font-family:inherit; margin-bottom:10px; }
  .gate button{ width:100%; padding:13px; border:none; border-radius:11px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .gate .keep{ font-size:12px; color:var(--sub); margin-top:12px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .gate .err{ color:#b0483a; font-size:12.5px; font-weight:700; margin-top:8px; min-height:16px; }

  /* 印刷 見積書 */
  #print-area{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ display:block; position:absolute; left:0; top:0; width:100%; padding:12mm 12mm 0; font-size:12px; color:#000; }
    #print-area h1{ text-align:center; font-size:24px; letter-spacing:.5em; margin:0 0 18px; }
    #print-area .pa-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
    #print-area .pa-to{ font-size:15px; border-bottom:1px solid #000; padding-bottom:3px; min-width:220px; }
    #print-area .pa-from{ font-size:11.5px; text-align:right; line-height:1.7; }
    #print-area .pa-total{ font-size:16px; font-weight:bold; border:2px solid #000; padding:8px 14px; display:inline-block; margin:6px 0 14px; }
    #print-area table{ width:100%; border-collapse:collapse; }
    #print-area th,#print-area td{ border:1px solid #555; padding:6px 8px; font-size:11.5px; }
    #print-area th{ background:#eee; }
    #print-area td.r{ text-align:right; }
    #print-area .pa-sum{ width:auto; margin-left:auto; margin-top:8px; }
    #print-area .pa-sum td{ border:none; padding:3px 8px; }
    #print-area .pa-sum td.r{ text-align:right; font-weight:bold; }
    #print-area .pa-note{ font-size:10.5px; color:#333; margin-top:14px; line-height:1.8; white-space:pre-wrap; }
  }
</style>

<div id="root"></div>
<div id="print-area"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n)||0).toLocaleString("ja-JP");
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayJP = ()=>{ const t=new Date(); return `${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日`; };

/* ===== ログイン（市場だけが使える・端末に保持） ===== */
const PASS = "ichiba2026";
const LS_AUTH = "hz_ichiba_tool_auth";
const LS_MARKET = "hz_ichiba_market";           // ログイン時の市場名（貴社名）
function isAuthed(){ return localStorage.getItem(LS_AUTH)==="1" || sessionStorage.getItem(LS_AUTH)==="1"; }

/* 取引先マスタ（getCustomers）— 市場名から取引方法(市売/付売)を自動判定 */
let CUSTOMERS = [];          // [{name, method}]
let METHOD_LOCKED = false;   // マスタで方式が確定したらトグルを隠して固定
async function fetchCustomers(){
  try{
    const r = await fetch(GAS_URL+"?action=getCustomers");
    const j = await r.json();
    CUSTOMERS = Array.isArray(j&&j.customers) ? j.customers : [];
  }catch(e){ CUSTOMERS = []; }
  return CUSTOMERS;
}
// 「御中」「様」「株式会社」等・空白を除去して比較用に正規化
function normName(s){ return String(s==null?"":s).replace(/(御中|様|さま|㈱|㈲|\(株\)|\(有\)|株式会社|有限会社|\s|　)/g,"").trim(); }
function matchCustomer(market){
  const m = normName(market); if(!m || !CUSTOMERS.length) return null;
  let hit = CUSTOMERS.find(c=>normName(c.name)===m);                                   // 完全一致
  if(!hit) hit = CUSTOMERS.find(c=>{ const n=normName(c.name); return n && (n.indexOf(m)===0 || m.indexOf(n)===0); }); // 前方一致
  return hit || null;
}
// 保存済み市場名＋CUSTOMERSから METHOD/METHOD_LOCKED を確定
function applyMarketMethod(){
  METHOD_LOCKED = false;
  const market = localStorage.getItem(LS_MARKET)||"";
  if(!market) return false;
  const hit = matchCustomer(market);
  if(hit && (hit.method==="市売" || hit.method==="付売")){
    METHOD = hit.method; METHOD_LOCKED = true; return true;
  }
  return false;
}
// 取引方法トグル or 固定バッジの表示切替
function applyMethodUI(){
  const seg=$("#seg-method"), fixed=$("#method-fixed"); if(!seg) return;
  if(METHOD_LOCKED){
    seg.style.display="none";
    if(fixed){
      const cls = METHOD==="市売"?"ichi":"tsuke";
      const txt = METHOD==="市売"?"市売（定価）":"付売（買取）";
      fixed.innerHTML = `貴社のお取引: <span class="mfx-lbl ${cls}">${txt}</span>`;
      fixed.style.display="";
    }
  }else{
    seg.style.display="";
    if(fixed) fixed.style.display="none";
  }
}

/* ===== 商品マスタ ===== */
const GRADES = ["丸節","小節","特上小","無節","無節特上小"];
/* 等級カラー（加工予定表 gradeColors と同一。無節特上→無節特上小に対応付け） */
const GRADE_COLORS = { "丸節":"#d32f2f", "小節":"#ef6c00", "特上小":"#8e24aa", "無節":"#1565c0", "無節特上小":"#6a1b9a" };
const GRADE_ROMAJI = { marubushi:"丸節", kobushi:"小節", tokujoko:"特上小", mubushi:"無節", marubushi_tokujoko:"無節特上小" };
const NYUSU = { 2000:"8枚", 3000:"10枚", 4000:"8枚" };
const PRODUCTS = [
  { type:"桧フローリング", thicknesses:[15,12], w:120, lengths:[2000,3000,4000] },
  { type:"桧羽目板",       thicknesses:[12],    w:120, lengths:[2000,3000,4000] }
];
const PB_RAW = {
  "市売": [
    ["桧フローリング",15,120,2000, 4000,5000,6600,8800,7700,null],
    ["桧フローリング",15,120,3000, 8000,8800,16500,20000,18000,null],
    ["桧フローリング",15,120,4000, 8800,12000,20000,24000,22000,13000],
    ["桧羽目板",12,120,2000, 4000,5000,6600,8800,7700,null],
    ["桧羽目板",12,120,3000, 8000,8800,16500,20000,18000,null],
    ["桧羽目板",12,120,4000, 8600,12000,20000,24000,22000,null],
    ["桧フローリング",12,120,2000, 4000,5000,6600,8800,7700,null],
    ["桧フローリング",12,120,3000, 8000,8800,16500,20000,18000,null],
    ["桧フローリング",12,120,4000, 8800,12000,20000,24000,22000,null]
  ],
  "付売": [
    ["桧フローリング",15,120,2000, 3500,4500,6000,8000,7000,null],
    ["桧フローリング",15,120,3000, 7300,8000,15000,18000,16500,null],
    ["桧フローリング",15,120,4000, 8000,12000,18000,22000,20000,null],
    ["桧羽目板",12,120,2000, 3500,4500,6000,8000,7000,null],
    ["桧羽目板",12,120,3000, 7300,8000,15000,18000,16500,null],
    ["桧羽目板",12,120,4000, 7800,12000,18000,22000,20000,null],
    ["桧フローリング",12,120,2000, 3500,4500,6000,8000,7000,null],
    ["桧フローリング",12,120,3000, 7300,8000,15000,18000,16500,null],
    ["桧フローリング",12,120,4000, 8000,12000,18000,22000,20000,null]
  ]
};
const PRICEBOOK = { "市売":{}, "付売":{} };
function buildPricebook(){
  ["市売","付売"].forEach(k=>{ PRICEBOOK[k]={};
    PB_RAW[k].forEach(r=>{ const key=`${r[0]}|${r[1]}|${r[2]}|${r[3]}`; const g={};
      GRADES.forEach((gl,i)=>{ const v=r[4+i]; if(v!=null) g[gl]=v; }); PRICEBOOK[k][key]=g; });
  });
}
buildPricebook();
function priceOf(method,name,t,w,l,grade){ const g=PRICEBOOK[method][`${name}|${t}|${w}|${l}`]; return (g&&g[grade]!=null)?g[grade]:null; }

/* ===== GAS ===== */
const GAS_URL   = "https://script.google.com/macros/s/AKfycbyE2O2zEk1NDYskaxflVtPReblSOyA5CyjfHTNXAYzK6tX1zgEzRypcFFSjtDy2SWa7wg/exec"; // getPrices
const STOCK_URL = "https://script.google.com/macros/s/AKfycbxvPjDv81vrJMW2GaqpCJooyxxt7__gvMF4mJkmcGNbNS2xGMoXgTnn6_OEPZ3Rr0spdg/exec"; // webboard: api=ichibastock
const STOCK_TOKEN = "hzy-ichiba-stock-2026";
const DB_URL    = "https://script.google.com/macros/s/AKfycbzskqossGk7mBeZEY2XrfqE2-MNS5b0PfgX65tpBfowD7mMwqXvueRe7E6Cclob2iFQ/exec"; // saveQuote

async function refreshPricebook(){
  try{
    for(const m of ["市売","付売"]){
      const r=await fetch(GAS_URL+"?action=getPrices&method="+encodeURIComponent(m)); const j=await r.json();
      const tbl={};
      (j.prices||[]).forEach(p=>{ const key=`${p.hinmei}|${p.thickness}|${p.width}|${p.length}`; const g={};
        Object.keys(GRADE_ROMAJI).forEach(rk=>{ const v=p[rk]; if(typeof v==="number" && v>0) g[GRADE_ROMAJI[rk]]=v; }); tbl[key]=g; });
      if(Object.keys(tbl).length) PRICEBOOK[m]=tbl;
    }
    renderPriceTables();
  }catch(e){}
}

/* 在庫（A級120mm原板共通・長さ×等級・束数）。webboardのトークン読取口から取得 */
const STOCK = {};   // "length|grade" -> qty(束)
let stockUpdated = "", stockOk = false;
async function refreshStock(){
  const meta=$("#stk-updated"); if(meta) meta.textContent="在庫を取得中…";
  try{
    const r=await fetch(STOCK_URL+"?api=ichibastock&token="+encodeURIComponent(STOCK_TOKEN),{cache:"no-store"});
    const j=await r.json();
    if(j&&j.ok&&Array.isArray(j.stock)){
      for(const k in STOCK) delete STOCK[k];
      j.stock.forEach(s=>{ STOCK[`${s.length}|${s.grade}`]=s.qty; });
      stockUpdated=j.updated||todayJP(); stockOk=true;
    }else{ stockOk=false; }
  }catch(e){ stockOk=false; }
  renderStock();
}

/* --- 価格表 --- */
function anyPrice(method,name,t,w,l){ return GRADES.some(g=>priceOf(method,name,t,w,l,g)!=null); }
/* (type×thickness) の 全長さ×全等級 価格を1本の文字列に。同一シグネチャ＝価格完全一致で統合 */
function priceSig(method,type,t,w,lengths){
  return lengths.map(l=>GRADES.map(g=>{ const p=priceOf(method,type,t,w,l,g); return p==null?"":p; }).join(",")).join(";");
}
function renderPriceTables(){
  const box=$("#price-box"); if(!box) return;
  $("#seg-method").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===METHOD));
  $("#pm-badge").textContent = METHOD==="市売"?"市売：定価":"付売：買取価格";
  $("#pm-badge").style.background = METHOD==="市売"?"var(--ichi)":"var(--tsuke)";
  $("#method-hint").innerHTML = METHOD==="市売"
    ? `いま表示中は <b class="ichi">市売＝当社設定の定価</b>（売れたら手数料をお受け取り）`
    : `いま表示中は <b class="tsuke">付売＝買取価格</b>（この値で仕入れて、貴社の売値を上乗せ）`;

  // 現METHODで価格を持つ (type × thickness) を列挙し、厚み跨ぎでも価格完全一致なら1表に統合
  const combos=[];
  PRODUCTS.forEach(pt=>{ pt.thicknesses.forEach(t=>{
    if(pt.lengths.some(l=>anyPrice(METHOD,pt.type,t,pt.w,l))) combos.push({type:pt.type,thickness:t,w:pt.w,lengths:pt.lengths});
  }); });
  const groups=[], idx={};
  combos.forEach(c=>{
    const sig=c.lengths.join("_")+"@"+priceSig(METHOD,c.type,c.thickness,c.w,c.lengths);
    if(idx[sig]==null){ idx[sig]=groups.length; groups.push({w:c.w,lengths:c.lengths,members:[]}); }
    groups[idx[sig]].members.push(c);
  });

  let html="";
  groups.forEach(gr=>{
    const rep=gr.members[0];                                    // 価格を引く実SKU（type＋厚みの代表）
    // 種類ごとの厚みを個別表記（例: フローリング 15・12mm ／ 羽目板 12mm）
    const typeThs={};
    gr.members.forEach(m=>{ (typeThs[m.type]=typeThs[m.type]||[]).push(m.thickness); });
    const parts=Object.keys(typeThs).map(ty=>({ty, ths:typeThs[ty].sort((a,b)=>b-a)}));
    const titleHTML=parts.map(p=>`${esc(p.ty)} <span class="tag">厚み ${p.ths.join("・")}mm</span>`).join("　");
    const merged=(parts.length>1 || parts[0].ths.length>1);
    const dispName= merged ? parts.map(p=>`${p.ty}(${p.ths.join("・")}mm)`).join("・") : parts[0].ty;
    const tDisp= merged ? "" : String(parts[0].ths[0]);   // 統合時は明細の厚みは品名側に含める
    const vls=gr.lengths.filter(l=>anyPrice(METHOD,rep.type,rep.thickness,gr.w,l));
    html+=`<div class="ptype">${titleHTML}</div>
      <div class="tscroll"><table class="grid">
        <thead><tr><th style="text-align:left;padding-left:12px">長さ＼等級</th>${GRADES.map(g=>`<th style="background:${GRADE_COLORS[g]||'#556'};color:#fff;border-bottom:none">${g}</th>`).join("")}</tr></thead>
        <tbody>${vls.map(l=>{
          return `<tr><th>${l/1000}m<small>1束＝${NYUSU[l]||""}</small></th>`+GRADES.map(g=>{
            const p=priceOf(METHOD,rep.type,rep.thickness,gr.w,l,g);
            if(p==null) return `<td class="pcell na">—</td>`;
            return `<td class="pcell" data-name="${esc(dispName)}" data-pname="${esc(rep.type)}" data-t="${rep.thickness}" data-tdisp="${tDisp}" data-w="${gr.w}" data-l="${l}" data-grade="${g}"><span class="num">${fmt(p)}</span><span class="add">＋見積</span></td>`;
          }).join("")+`</tr>`;
        }).join("")}</tbody>
      </table></div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll(".pcell[data-name]").forEach(td=>td.addEventListener("click",()=>{
    addLine(td.dataset.name, td.dataset.pname, Number(td.dataset.t), Number(td.dataset.w), Number(td.dataset.l), td.dataset.grade, td.dataset.tdisp);
  }));
}

/* --- 在庫 --- */
// 無節特上小の在庫＝無節と特上小の少ない方（負値=無限在庫は制約なし扱い→もう一方が効く。両方無限なら-1=潤沢）
function derivedStock(qm, qt){
  if(qm==null || qt==null) return null;
  const em = qm<0 ? Infinity : qm, et = qt<0 ? Infinity : qt;
  const mn = Math.min(em, et);
  return mn===Infinity ? -1 : mn;
}
// 2m小節＝2m在庫＋4m小節の倍量（最悪4mを木取り: 4m1束→2m相当2束）。どちらか潤沢なら潤沢
function cutAugmented(base, four){
  if(base==null && four==null) return null;
  const b=base==null?0:base, f=four==null?0:four;
  if(b<0 || f<0) return -1;
  return b + f*2;
}
function renderStock(){
  const box=$("#stock-box"); if(!box) return;
  const lens=[2000,3000,4000];
  box.innerHTML=`<div class="tscroll"><table class="grid">
    <thead><tr><th style="text-align:left;padding-left:12px">長さ＼等級</th>${GRADES.map(g=>`<th style="background:${GRADE_COLORS[g]||'#556'};color:#fff;border-bottom:none">${g}</th>`).join("")}</tr></thead>
    <tbody>${lens.map(l=>`<tr><th>${l/1000}m</th>`+GRADES.map(g=>{
      let q, tipTxt="";
      if(g==="無節特上小"){            // 在庫を持たず、無節と特上小の少ない方で表示
        q=derivedStock(STOCK[`${l}|無節`], STOCK[`${l}|特上小`]); tipTxt="無節と特上小の少ない方の在庫を表示";
      }else if(l===2000 && g==="小節"){  // 最悪4m小節を木取り（4m1束→2m相当2束）できる分を上乗せ
        const four=STOCK[`4000|小節`];
        q=cutAugmented(STOCK[`2000|小節`], four);
        if(four!=null && four!==0) tipTxt="4m小節を木取りできる分（1束→2m×2束）を含む";
      }else{
        q=STOCK[`${l}|${g}`];
      }
      const s=stockClass(q);
      if(!stockOk || q==null) return `<td class="stk-cell stk-none">—</td>`;
      const tip = tipTxt ? ` title="${tipTxt}"` : "";
      if(s.ample) return `<td class="stk-cell ${s.c}"${tip}>${s.m} 潤沢</td>`;
      return `<td class="stk-cell ${s.c}"${tip}>${s.m} ${q}<small>束</small></td>`;
    }).join("")+`</tr>`).join("")}</tbody>
  </table></div>`;
  const meta=$("#stk-updated");
  if(meta) meta.textContent = stockOk ? `最終更新：${stockUpdated}` : "在庫連携は準備中（GASに在庫読取口を追加すると自動表示）";
}

/* --- 見積 --- */
function addLine(name,pname,t,w,l,grade,tDisp){
  const price=priceOf(METHOD,pname,t,w,l,grade); if(price==null) return;
  const ex=lines.find(x=>x.name===name&&x.pname===pname&&x.t===t&&x.l===l&&x.grade===grade&&x.method===METHOD);
  if(ex) ex.qty+=1; else lines.push({name,pname,t,tDisp:(tDisp!=null?tDisp:String(t)),w,l,grade,qty:1,method:METHOD,price});
  renderQuote();
}
function linesSubtotal(){ return lines.reduce((s,x)=>s+priceOf(x.method,x.pname,x.t,x.w,x.l,x.grade)*x.qty,0); }

}

/* --- 運賃（運賃ツールiframe） --- */
function fareReady(){ const f=$("#fare-frame"); try{ return !!(f&&f.contentWindow&&f.contentWindow.calcSeino&&f.contentDocument&&f.contentDocument.getElementById("s-pref")&&f.contentDocument.getElementById("s-pref").options.length); }catch(e){ return false; } }
function fareOne(pref,lenM,qty){ const f=$("#fare-frame"),w=f.contentWindow,doc=f.contentDocument;
  try{ if(doc.getElementById("s-mix-mode")&&doc.getElementById("s-mix-mode").style.display!=="none"&&typeof w.toggleMixMode==="function") w.toggleMixMode(false);
    doc.getElementById("s-pref").value=pref; doc.getElementById("s-length").value=String(lenM);
    if(typeof w.updateQtyLabel==="function") w.updateQtyLabel();
    const sq=doc.getElementById("s-qty"); if(![...sq.options].some(o=>o.value===String(qty))) sq.add(new Option(String(qty),String(qty)));
    sq.value=String(qty); w.calcSeino();
    const el=doc.querySelector("#seino-result tr.total td"); if(el){ const n=parseInt(el.textContent.replace(/[^0-9]/g,"")); if(n>0) return n; } return null;
  }catch(e){ return null; }
}
function calcFreight(){
  if(!lines.length) return {incl:0,ok:true,note:""};
  if(!fareReady()) return {incl:null,ok:false,note:"運賃計算を読み込み中…"};
  const byLen={}; lines.forEach(x=>{ const lm=Math.round(x.l/1000); byLen[lm]=(byLen[lm]||0)+x.qty; });
  let sum=0; for(const lm in byLen){ const v=fareOne(DEST,lm,byLen[lm]); if(v==null) return {incl:null,ok:false,note:"この地域・数量は個別見積（運賃はお問い合わせ）"}; sum+=v; }
  return {incl:sum, ok:true, note:Object.keys(byLen).length>1?"※長さ違いは梱包ごとに算出した合計":""};
}
const excl = incl => Math.round((incl||0)/1.1);

let _lastCalc={sub:0,shipEx:null,tax:0,total:0};
function updateSum(){
  const t=$("#sum-table"); if(!t) return;
  const sub=linesSubtotal(); const fr=calcFreight();
  if($("#ship-note")) $("#ship-note").textContent=fr.note||"";
  let shipEx=null,total=null,tax=0;
  if(fr.ok&&fr.incl!=null){ shipEx=excl(fr.incl); tax=Math.floor((sub+shipEx)*0.1); total=sub+shipEx+tax;
    t.innerHTML=`<tr><th>商品計（税別）</th><td>${fmt(sub)}円</td></tr>
      <tr><th>運賃（税別・${esc(DEST)}）</th><td>${fmt(shipEx)}円</td></tr>
      <tr><th>消費税（10%）</th><td>${fmt(tax)}円</td></tr>
      <tr class="total"><th>合計（税込）</th><td>${fmt(total)}円</td></tr>`;
  }else{
    t.innerHTML=`<tr><th>商品計（税別）</th><td>${fmt(sub)}円</td></tr><tr><th>運賃</th><td>${fr.incl===null&&!fr.ok?"—":"計算中…"}</td></tr>`;
    if(!window._fr){ window._fr=setInterval(()=>{ if(fareReady()){ clearInterval(window._fr); window._fr=null; updateSum(); } },700); }
  }
  _lastCalc={sub,shipEx,tax,total};
}

/* --- 見積書 印刷 --- */
function doPrint(){
  const {sub,shipEx,tax,total}=_lastCalc;
  const to=($("#q-to")&&$("#q-to").value.trim())||"";
  const from=($("#q-from")&&$("#q-from").value.trim())||"株式会社 林材木店";
  const memo=($("#q-memo")&&$("#q-memo").value.trim())||"";
  const nouki=($("#q-nouki")&&$("#q-nouki").value.trim())||"";
  const rows=lines.map(x=>{ const p=priceOf(x.method,x.pname,x.t,x.w,x.l,x.grade);
    return `<tr><td>${esc(x.name)}</td><td>${esc(x.grade)}</td><td class="r">${x.tDisp?esc(x.tDisp)+"×":""}${x.w}×${x.l}</td><td class="r">${x.qty}束</td><td class="r">${fmt(p)}円</td><td class="r">${fmt(p*x.qty)}円</td></tr>`; }).join("");
  let sumRows=`<tr><td>商品計（税別）</td><td class="r">${fmt(sub)}円</td></tr>`;
  if(shipEx!=null){ sumRows+=`<tr><td>運賃（税別・${esc(DEST)}向け）</td><td class="r">${fmt(shipEx)}円</td></tr><tr><td>消費税（10%）</td><td class="r">${fmt(tax)}円</td></tr>`; }
  const totalStr = shipEx!=null ? `${fmt(total)}円` : "（運賃 別途）";
  $("#print-area").innerHTML=`
    <h1>御 見 積 書</h1>
    <div class="pa-head">
      <div><div class="pa-to">${to?esc(to):"　"}</div><div style="font-size:11px;margin-top:6px">下記の通りお見積り申し上げます。</div>
        <div class="pa-total">御見積金額　${totalStr}（税込）</div></div>
      <div class="pa-from"><b>${esc(from)}</b><br>静岡県浜松市中央区和田町439-2<br>TEL 053-461-0230　FAX 053-462-3673<br>発行日：${todayJP()}${memo?`<br>${esc(memo)}`:""}</div>
    </div>
    <table>
      <tr><th>品名</th><th>等級</th><th>寸法(mm)</th><th>数量</th><th>単価(税別)</th><th>金額(税別)</th></tr>
      ${rows}
    </table>
    <table class="pa-sum"><tbody>${sumRows}<tr><td style="font-weight:bold">合計（税込）</td><td class="r" style="font-weight:bold;font-size:14px">${totalStr}</td></tr></tbody></table>
    <div class="pa-note">※運賃は${esc(DEST)}向けの目安です。荷姿・お届け先により変わる場合があります。${nouki?`\n※納期目安：${esc(nouki)}`:""}\n※本見積の有効期限：発行日より2週間</div>`;
  window.print();
}

/* --- 見積内容をオブジェクト化 --- */
function buildQuoteObj(reqType){
  const {sub,shipEx,tax,total}=_lastCalc;
  return {
    reqType: reqType||"",
    date:new Date().toISOString().slice(0,10),
    market:($("#q-market")&&$("#q-market").value.trim())||"",
    reqTanto:($("#q-reqtanto")&&$("#q-reqtanto").value.trim())||"",
    contact:($("#q-contact")&&$("#q-contact").value.trim())||"",
    email:($("#q-email")&&$("#q-email").value.trim())||"",
    fax:($("#q-fax")&&$("#q-fax").value.trim())||"",
    ackVia:(document.querySelector('input[name="ackvia"]:checked')||{}).value || "mail",
    customer:($("#q-to")&&$("#q-to").value.trim())||"",
    kubun:lines.length?lines[0].method:"", dest:DEST,
    carrier:"", freight:shipEx||"", sub:sub||"", tax:tax||"", grand:total||"",
    nouki:($("#q-nouki")&&$("#q-nouki").value.trim())||"", remarks:"市場ツールより",
    items:lines.map(x=>({name:x.name,pname:x.pname,grade:x.grade,t:x.t,tDisp:x.tDisp||String(x.t),w:x.w,l:x.l,"in":NYUSU[x.l]||"",qty:x.qty,price:priceOf(x.method,x.pname,x.t,x.w,x.l,x.grade),method:x.method}))
  };
}
function flash(msg,ok){ const m=$("#save-msg"); if(!m) return; m.textContent=msg; m.style.color=ok===false?"#b0483a":"#2e7d4f"; setTimeout(()=>{ if($("#save-msg")) $("#save-msg").textContent=""; },5000); }

/* --- 林材木店へ 正式見積依頼 / 注文 を送信 --- */
function doRequest(reqType){
  if(!lines.length){ flash("先に商品を追加してください",false); return; }
  const market=($("#q-market")&&$("#q-market").value.trim())||"";
  const email=($("#q-email")&&$("#q-email").value.trim())||"";
  const fax=($("#q-fax")&&$("#q-fax").value.trim())||"";
  const ackVia=(document.querySelector('input[name="ackvia"]:checked')||{}).value || "mail";
  if(!market){ flash("発注元（市場名）をご入力ください",false); if($("#q-market")) $("#q-market").focus(); return; }
  if((ackVia==="mail"||ackVia==="both") && !email){ flash("控えメール用のメールアドレスをご入力ください",false); if($("#q-email")) $("#q-email").focus(); return; }
  if((ackVia==="fax"||ackVia==="both") && !fax){ flash("控えFAX用のFAX番号をご入力ください",false); if($("#q-fax")) $("#q-fax").focus(); return; }
  const label = reqType==="注文" ? "注文" : "正式見積依頼";
  if(!confirm(`林材木店へ「${label}」を送信します。よろしいですか？\n\n発注元：${market}\n合計（税込）：${fmt(_lastCalc.total||0)}円`)) return;
  const quote=buildQuoteObj(reqType);
  try{
    fetch(DB_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"saveQuote",quote})}).catch(()=>{});
    saveDraftLocal(quote, reqType);   // 送信控えも端末に残す
    const viaTxt = ackVia==="both" ? "メールとFAX" : ackVia==="fax" ? "FAX" : "メール";
    flash(`✅ ${label}を送信しました。受付控えを${viaTxt}にお送りします。`);
  }catch(e){ flash("送信に失敗しました。お手数ですがお電話ください。",false); }
}

/* --- 端末内の控え（localStorage） --- */
const LS_DRAFTS="hz_ichiba_drafts";
function loadDrafts(){ try{ return JSON.parse(localStorage.getItem(LS_DRAFTS))||[]; }catch(e){ return []; } }
function saveDraftLocal(quote, tag){
  const d=loadDrafts();
  d.unshift({ id:"D"+Date.now()+Math.floor(Math.random()*1000), savedAt:new Date().toLocaleString("ja-JP"), tag:tag||"控え", quote });
  localStorage.setItem(LS_DRAFTS, JSON.stringify(d.slice(0,50)));
  updateDraftCount(); renderDrafts();
}
function doSaveDraft(){
  if(!lines.length){ flash("先に商品を追加してください",false); return; }
  saveDraftLocal(buildQuoteObj(""), "控え");
  flash("✅ この端末に控えを保存しました（下の「保存した控え」で確認できます）");
}
function updateDraftCount(){ const n=$("#draft-n"); if(n){ const c=loadDrafts().length; n.textContent=c?`（${c}件）`:""; } }
function renderDrafts(){
  const p=$("#drafts-panel"); if(!p) return;
  const d=loadDrafts();
  if(!d.length){ p.innerHTML=`<div class="q-empty">保存した控えはまだありません。見積フッターの「💾 控えを保存」で残せます。</div>`; return; }
  p.innerHTML=
    d.map(r=>{
      const q=r.quote; const items=(q.items||[]).map(it=>`${it.name} ${it.grade} ${it.l/1000}m×${it.qty}束`).join("、");
      const tagCls = r.tag==="注文"?"tg-order":r.tag==="依頼"?"tg-req":"tg-draft";
      const tagTxt = r.tag==="注文"?"注文済":r.tag==="依頼"?"依頼済":"控え";
      return `<div class="draft-row">
        <div class="dr-main">
          <div class="dr-top"><span class="dr-tag ${tagCls}">${tagTxt}</span><b>${fmt(q.grand||0)}円</b><span class="dr-date">${esc(r.savedAt)}</span></div>
          <div class="dr-items">${esc(items)}${q.market?`　<span class="dr-mk">発注元:${esc(q.market)}</span>`:""}${q.dest?`／${esc(q.dest)}`:""}</div>
        </div>
        <div class="dr-btns">
          <button class="dr-recall" data-id="${r.id}">再表示</button>
          <button class="dr-del" data-id="${r.id}">削除</button>
        </div>
      </div>`;
    }).join("");
  p.querySelectorAll(".dr-recall").forEach(b=>b.addEventListener("click",()=>recallDraft(b.dataset.id)));
  p.querySelectorAll(".dr-del").forEach(b=>b.addEventListener("click",()=>{ const d2=loadDrafts().filter(x=>x.id!==b.dataset.id); localStorage.setItem(LS_DRAFTS,JSON.stringify(d2)); renderDrafts(); updateDraftCount(); }));
}
function recallDraft(id){
  const r=loadDrafts().find(x=>x.id===id); if(!r) return;
  const q=r.quote;
  lines=(q.items||[]).map(it=>({name:it.name,pname:it.pname||it.name,t:Number(it.t),tDisp:it.tDisp||String(it.t),w:Number(it.w),l:Number(it.l),grade:it.grade,qty:Number(it.qty),method:it.method||q.kubun||"付売",price:it.price}));
  DEST=q.dest||"東京";
  renderQuote();
  if($("#q-dest")) $("#q-dest").value=DEST;
  if(q.customer&&$("#q-to")) $("#q-to").value=q.customer;
  updateSum();
  $("#quote-box").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===== 起動 ===== */
if(isAuthed()) renderMain(); else renderGate();
</script>

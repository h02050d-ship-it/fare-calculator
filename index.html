<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
<title>運賃自動計算ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Hiragino Sans', 'Meiryo', sans-serif; background: #f5f5f5; color: #333; padding: 16px; max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 20px; font-size: 1.4em; }
.panel { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 20px; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.85em; font-weight: bold; color: #555; }
.form-group select, .form-group input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; min-width: 120px; }
.form-group select:focus, .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 3px rgba(52,152,219,0.3); }
.channel-row { display: flex; gap: 8px; margin-bottom: 14px; }
.channel-btn { padding: 8px 16px; border: 2px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; font-size: 0.9em; font-weight: bold; transition: all 0.15s; }
.channel-btn.active { border-color: #2980b9; background: #ebf5fb; color: #2980b9; }
.channel-btn.active[onclick*="rakuten"] { border-color: #bf0000; background: #fef0f0; color: #bf0000; }
.channel-btn.active[onclick*="yahoo"] { border-color: #ff0033; background: #fff0f3; color: #ff0033; }
.channel-btn:hover { border-color: #2980b9; }
.result-box { background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 8px; padding: 16px; margin-top: 16px; }
.result-box h3 { margin-bottom: 12px; font-size: 1.1em; }
.result-table { width: 100%; border-collapse: collapse; }
.result-table th, .result-table td { padding: 8px 12px; text-align: right; border-bottom: 1px solid #eee; }
.result-table th { text-align: left; font-weight: normal; color: #666; width: 45%; }
.result-table tr.total td { font-size: 1.3em; font-weight: bold; color: #c0392b; border-top: 2px solid #333; }
.result-table tr.total th { border-top: 2px solid #333; font-weight: bold; font-size: 1.1em; }
.result-table tr.sub td { color: #888; font-size: 0.9em; }
.note { font-size: 0.8em; color: #888; margin-top: 8px; }
.error-box { background: #fdedec; border-color: #e74c3c; }
.error-box h3 { color: #c0392b; }
.error-box p { margin: 6px 0; }
.info-badge { display: inline-block; background: #eaf2f8; color: #2471a3; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 4px; }
.mix-btn { padding: 8px 16px; border: 2px solid #8e44ad; border-radius: 6px; cursor: pointer; background: #f5eef8; color: #8e44ad; font-size: 0.9em; font-weight: bold; }
.mix-btn:hover { background: #8e44ad; color: #fff; }
.mix-btn-cancel { border-color: #888; background: #f0f0f0; color: #666; }
.mix-btn-cancel:hover { background: #888; color: #fff; }
.mix-grid { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
.mix-row { display: grid; grid-template-columns: 50px 90px 70px 80px 100px; gap: 8px; padding: 6px 12px; align-items: center; }
.mix-row input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; width: 80px; text-align: right; }
.mix-row input:focus { outline: none; border-color: #3498db; }
.mix-header { background: #f0f0f0; font-weight: bold; font-size: 0.8em; color: #555; }
.mix-total { background: #f8f9fa; font-weight: bold; border-top: 2px solid #ccc; }
.mix-auto { font-size: 0.85em; color: #888; }
.office-list { margin-top: 12px; }
.office-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
.office-item:hover { border-color: #2980b9; background: #f8fbff; }
.office-item.selected { border-color: #2980b9; background: #ebf5fb; }
.office-rank { font-weight: bold; color: #2980b9; margin-right: 10px; min-width: 24px; }
.office-info { flex: 1; }
.office-name { font-weight: bold; font-size: 1em; }
.office-addr { font-size: 0.85em; color: #666; margin-top: 2px; }
.office-dist { font-weight: bold; color: #c0392b; font-size: 0.95em; white-space: nowrap; }
.searching { color: #888; font-style: italic; padding: 8px 0; }
@media (max-width: 600px) {
  .form-row { flex-direction: column; }
  .form-group select, .form-group input { min-width: 100%; }
}
</style>
</head>
<body>
<h1>運賃自動計算ツール（西濃）</h1>

<div class="panel" style="border-radius:8px; margin-bottom:16px;">
  <div class="form-row">
    <div class="form-group" style="flex:1;">
      <label>届け先住所</label>
      <input type="text" id="addr-input" placeholder="住所を入力（例：静岡県磐田市福田5490-47）" style="min-width:300px;" oninput="onAddrInput()">
    </div>
    <div class="form-group" style="align-self:flex-end;">
      <button class="mix-btn" onclick="searchOffice()" id="search-btn">営業所検索</button>
    </div>
  </div>
  <div id="office-result"></div>
</div>

<div id="seino-panel" class="panel active" style="border-radius:8px;">
  <div class="channel-row">
    <div class="channel-btn active" onclick="setChannel(this,'net')">ネット販売（税込）</div>
    <div class="channel-btn" onclick="setChannel(this,'yahoo')">ヤフー（税込）</div>
    <div class="channel-btn" onclick="setChannel(this,'rakuten')">楽天（税込）</div>
    <div class="channel-btn" onclick="setChannel(this,'ichi')">市売・付売（税抜）</div>
    <label style="display:flex;align-items:center;gap:6px;margin-left:12px;font-size:0.9em;cursor:pointer;">
      <input type="checkbox" id="s-genba" onchange="calcSeino()"> 現場渡し（+25円/kg）
    </label>
  </div>
  <!-- 通常モード -->
  <div id="s-normal-mode">
    <div class="form-row">
      <div class="form-group">
        <label>送付先</label>
        <select id="s-pref" onchange="calcSeino()"></select>
      </div>
      <div class="form-group">
        <label>長さ (m)</label>
        <select id="s-length" onchange="calcSeino()">
          <option value="2">2m</option>
          <option value="3">3m</option>
          <option value="4" selected>4m</option>
        </select>
      </div>
      <div class="form-group">
        <label>数量 (束)</label>
        <input type="number" id="s-qty" value="15" min="0" step="1" onchange="calcSeino()" oninput="calcSeino()">
      </div>
      <div class="form-group" style="align-self:flex-end;">
        <button class="mix-btn" onclick="toggleMixMode(true)">混載</button>
      </div>
    </div>
  </div>
  <!-- 混載モード -->
  <div id="s-mix-mode" style="display:none;">
    <div class="form-row">
      <div class="form-group">
        <label>送付先</label>
        <select id="s-pref-mix" onchange="calcSeino()"></select>
      </div>
      <div class="form-group" style="align-self:flex-end;">
        <button class="mix-btn mix-btn-cancel" onclick="toggleMixMode(false)">通常に戻す</button>
      </div>
    </div>
    <div class="mix-grid">
      <div class="mix-row mix-header"><span>長さ</span><span>数量(束)</span><span>重量/束</span><span>小計重量</span><span>ダンボール代</span></div>
      <div class="mix-row"><span>2m</span><input type="number" id="mix-q2" value="0" min="0" step="1" oninput="calcSeino()"><span class="mix-auto">20kg</span><span id="mix-sw2">0</span><span id="mix-db2">0</span></div>
      <div class="mix-row"><span>3m</span><input type="number" id="mix-q3" value="0" min="0" step="1" oninput="calcSeino()"><span class="mix-auto">30kg</span><span id="mix-sw3">0</span><span id="mix-db3">0</span></div>
      <div class="mix-row"><span>4m</span><input type="number" id="mix-q4" value="0" min="0" step="1" oninput="calcSeino()"><span class="mix-auto">40kg</span><span id="mix-sw4">0</span><span id="mix-db4">0</span></div>
      <div class="mix-row mix-total"><span>合計</span><span id="mix-qtotal">0</span><span></span><span id="mix-swtotal">0kg</span><span id="mix-dbtotal">0円</span></div>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>合計重量 (kg)</label>
      <input type="number" id="s-total-weight" readonly style="background:#eee;">
    </div>
    <div class="form-group">
      <label>適用重量帯 (kg)</label>
      <input type="text" id="s-tier-weight" readonly style="background:#eee;">
    </div>
  </div>
  <div id="seino-result"></div>
  <div id="bundle-ref" style="margin-top:12px;padding:10px 14px;background:#f8f8f8;border-radius:6px;font-size:13px;color:#666;">
    <div style="font-weight:bold;margin-bottom:4px;color:#555;">1束あたり運賃の目安（ネット税込）</div>
    <div id="bundle-ref-table"></div>
  </div>
</div>

<script>
// ===== 西濃データ =====
const SEINO_DISTANCES = [150,200,250,300,350,400,450,500,550,600,650,700,750,800,850,900,950,1000,1100,1200,1300,1400];

const SEINO_PREF_MAP = {

  "大阪":12,"長野":13,"栃木":14,"和歌山":15,"石川":16,"徳島":17,
  "茨城":18,"群馬":19,"兵庫":20,"福島":21,"鳥取":22,"岡山":23,

// prefIndex → distance column index
const PREF_TO_DIST = [

];

const SEINO_WEIGHTS = [10,20,30,40,60,80,100,120,140,160,180,200,250,300,350,400,450,500,550,600,650,700,750,800,850,900,950,1000];

const SEINO_FARES = [
  [1500,1500,1600,1600,1600,1600,1600,1600,1600,1600,1900,1900,2000,2000,2200,2200,2200,2200,2200,2200,2200,2200],
  [1700,1800,1800,1800,1800,1900,1900,1900,2000,2000,2400,2400,2600,2600,2700,2700,2800,2800,2900,2900,3000,3100],
  [2000,2000,2000,2000,2100,2100,2100,2100,2200,2200,2700,2800,2900,2900,3100,3200,3200,3300,3400,3500,3600,3700],
  [2200,2300,2400,2400,2400,2500,2500,2600,2700,2700,3300,3300,3600,3600,3900,4000,4100,4200,4300,4500,4600,4800],
  [2400,2500,2600,2700,2800,3000,3100,3100,3100,3200,3900,4000,4200,4300,4700,4800,4900,4900,5200,5400,5600,5800],
  [2900,3000,3100,3300,3400,3600,3700,3800,3900,4000,4900,5000,5400,5600,5900,6100,6300,6500,6800,7100,7400,7800],
  [3300,3500,3600,3800,4000,4200,4400,4500,4600,4800,5800,6000,6400,6600,7200,7300,7500,7800,8200,8600,9000,9400],
  [3700,4000,4300,4400,4600,4900,5100,5200,5400,5600,7100,7200,7800,8000,8500,8800,9000,9300,9800,10300,10800,11300],
  [4200,4500,4700,5100,5200,5500,5800,6000,6200,6400,8000,8300,8900,9300,9800,10100,10500,10700,11300,11900,12600,13200],
  [4600,4900,5300,5600,5800,6100,6400,6700,6900,7200,9000,9300,10100,10400,11100,11400,11700,12100,12800,13500,14200,15000],
  [5000,5400,5700,6100,6400,6700,7000,7400,7600,8000,10000,10300,11100,11500,12200,12600,13000,13500,14300,15100,15900,16700],
  [5400,5700,6200,6400,6700,7200,7400,7700,8100,8400,10500,10800,11700,12200,12900,13300,13700,14200,15000,15900,16800,17600],
  [6300,6900,7300,7800,8200,8700,9000,9500,9900,10300,12800,13400,14400,15000,15700,16200,16800,17400,18500,19600,20700,21700],
  [7500,8100,8700,9200,9700,10200,10800,11300,11700,12300,15300,15900,17200,17900,18800,19500,20100,20700,22100,23400,24700,26000],
  [8500,9100,9900,10600,11100,11700,12400,12900,13600,14200,17700,18400,19900,20700,21800,22500,23400,24200,25700,27300,28900,30500],
  [9700,10500,11300,12000,12600,13400,14100,14800,15400,16200,20100,21000,22700,23600,24900,25800,26700,27600,29400,31200,33000,34800],
  [10700,11700,12600,13400,14200,14900,15700,16500,17300,18100,22500,23500,25500,26500,27900,29000,30000,31000,33100,35100,37100,39200],
  [11700,12700,13800,14700,15500,16500,17400,18200,19100,20000,25000,26100,28300,29400,31000,32200,33300,34400,36700,39000,41300,43600],
  [15200,16500,18000,19100,20300,21500,22600,23900,25100,26200,27900,29000,31500,32800,35400,36800,38000,39400,42000,44700,47300,49900],
  [16400,17800,19500,20700,22000,23400,24700,26000,27200,28600,30300,31600,34300,35800,38600,40000,41400,42900,45800,48700,51500,54400],
  [17600,19300,21000,22400,23800,25200,26600,28000,29500,30800,32800,34200,37100,38700,41800,43300,44900,46500,49600,52800,55900,59000],
  [18900,20700,22500,24000,25500,27000,28600,30100,31700,33200,35200,36900,40000,41600,45000,46700,48300,50000,53400,56700,60100,63500],
  [20200,22100,24000,25700,27300,28900,30600,32300,33900,35500,37800,39400,42800,44600,48100,49900,51800,53500,57100,60800,64400,68000],
  [21500,23500,25600,27300,29000,30800,32600,34300,36000,37800,40200,42000,45600,47500,51200,53200,55200,57100,61000,64900,68800,72700],
  [22700,24900,27000,28900,30800,32600,34500,36400,38300,40200,42600,44600,48500,50400,54500,56600,58500,60700,64900,69000,73100,77300],
  [24000,26300,28600,30600,32500,34500,36500,38600,40500,42400,45100,47100,51300,53300,57600,59800,62100,64200,68600,73000,77400,81800],
  [25300,27700,30200,32300,34300,36400,38500,40600,42700,44800,47700,49800,54100,56300,60800,63100,65500,67800,72500,77100,81700,86400],
  [26600,29100,31600,33900,36000,38300,40500,42700,45000,47100,50100,52300,56800,59300,64000,66500,68900,71300,76200,81100,86000,90900]
];

// ダンボール代・重量/束
const DANBALL = {
  1: { weight: 20, box: 320 },
  2: { weight: 20, box: 160 },
  3: { weight: 30, box: 240 },
  4: { weight: 40, box: 320 }
};

// ===== Yahoo送料データ（西濃運輸・都道府県×比例重量別） =====
// base: 初期送料(重量0), add: 10増加ごとの追加送料
const YAHOO_SEINO = {
  "北海道":{base:1160,add:1160},"青森":{base:1810,add:990},"岩手":{base:1960,add:840},
  "宮城":{base:1730,add:670},"秋田":{base:1960,add:840},"山形":{base:1750,add:750},
  "福島":{base:1420,add:580},"東京":{base:1520,add:480},"神奈川":{base:1550,add:450},
  "埼玉":{base:1500,add:500},"千葉":{base:1500,add:500},"茨城":{base:1440,add:560},
  "栃木":{base:1470,add:530},"群馬":{base:1440,add:560},"山梨":{base:1520,add:480},
  "新潟":{base:1390,add:610},"長野":{base:1500,add:500},"富山":{base:1360,add:640},
  "石川":{base:1470,add:530},"福井":{base:1360,add:640},"愛知":{base:1510,add:390},
  "岐阜":{base:1480,add:420},"静岡":{base:1510,add:390},"三重":{base:1550,add:450},
  "大阪":{base:1500,add:500},"兵庫":{base:1440,add:560},"京都":{base:1520,add:480},
  "滋賀":{base:1550,add:450},"奈良":{base:1520,add:480},"和歌山":{base:1470,add:530},
  "鳥取":{base:1420,add:580},"島根":{base:1720,add:780},"岡山":{base:1420,add:580},
  "広島":{base:1700,add:700},"山口":{base:1930,add:870},"徳島":{base:1470,add:530},
  "香川":{base:1390,add:610},"愛媛":{base:1700,add:700},"高知":{base:1390,add:610},
  "福岡":{base:1900,add:900},"佐賀":{base:1870,add:930},"長崎":{base:1810,add:990},
  "熊本":{base:1810,add:990},"大分":{base:1810,add:990},"宮崎":{base:1700,add:1100},
  "鹿児島":{base:1700,add:1100},"沖縄":{base:2640,add:1860}
};
// Yahoo商品のshipWeight（Yahooストア設定値）と束数/セット
const YAHOO_SHIP_WEIGHT = { 2: 40, 3: 30, 4: 40 };
const YAHOO_BUNDLE_PER_SET = { 2: 2, 3: 1, 4: 1 }; // 2mは1セット2束

// ===== 状態 =====
let seinoChannel = 'net';

// ===== 初期化 =====
function init() {
  const prefNames = Object.keys(SEINO_PREF_MAP);
  const sPref = document.getElementById('s-pref');
  const sPrefMix = document.getElementById('s-pref-mix');

  prefNames.forEach(p => {
    sPref.appendChild(new Option(p, p));
    sPrefMix.appendChild(new Option(p, p));
  });

  calcSeino();
  buildBundleRef();
}

function buildBundleRef() {
  let html = '';
  const maxDistIdx = PREF_TO_DIST[SEINO_PREF_MAP['埼玉']]; // 最大は埼玉基準
  for (const len of [2, 3, 4]) {
    const d = DANBALL[len];
    let minPB = Infinity, maxPB = 0;
    for (let qty = 1; qty <= 20; qty++) {
      const w = Math.ceil(qty * d.weight);
      let ti = SEINO_WEIGHTS.findIndex(v => v >= w);
      if (ti === -1) ti = SEINO_WEIGHTS.length - 1;
      for (let di = 0; di < SEINO_DISTANCES.length; di++) {
        if (di > maxDistIdx) continue;
        const fare = SEINO_FARES[ti][di];
        const sub = fare + qty * d.box;
        const total = Math.round((sub + Math.round(sub * 0.1)) / 100) * 100;
        const pb = Math.round(total / qty);
        if (pb < minPB) minPB = pb;
        if (pb > maxPB) maxPB = pb;
      }
    }
    html += `<span style="margin-right:16px;">${len}m：${minPB.toLocaleString()}円〜${maxPB.toLocaleString()}円</span>`;
  }
  document.getElementById('bundle-ref-table').innerHTML = html;
}

function setChannel(btn, ch) {
  btn.parentElement.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  seinoChannel = ch;
  calcSeino();
}

// ===== 混載モード =====
let mixMode = false;

function toggleMixMode(on) {
  mixMode = on;
  document.getElementById('s-normal-mode').style.display = on ? 'none' : '';
  document.getElementById('s-mix-mode').style.display = on ? '' : 'none';
  // 混載送付先を通常と同期
  if (on) {
    document.getElementById('s-pref-mix').value = document.getElementById('s-pref').value;
  }
  calcSeino();
}

// ===== 西濃計算 =====
function calcSeino() {
  let pref, totalWeight, boxCost, totalQty, boxDetail, primaryLength;

  if (mixMode) {
    pref = document.getElementById('s-pref-mix').value;
    totalWeight = 0;
    boxCost = 0;
    totalQty = 0;
    boxDetail = [];
    primaryLength = null;
    let maxQty = 0;

    for (let len = 2; len <= 4; len++) {
      const q = parseInt(document.getElementById(`mix-q${len}`).value) || 0;
      const d = DANBALL[len];
      const sw = Math.ceil(q * d.weight);
      const db = q * d.box;
      totalWeight += sw;
      boxCost += db;
      totalQty += q;
      if (q > maxQty) { maxQty = q; primaryLength = len; }

      document.getElementById(`mix-sw${len}`).textContent = sw > 0 ? `${sw}kg` : '0';
      document.getElementById(`mix-db${len}`).textContent = db > 0 ? `${db.toLocaleString()}円` : '0';
      if (q > 0) boxDetail.push(`${d.box}×${q}`);
    }
    totalWeight = Math.ceil(totalWeight);
    document.getElementById('mix-qtotal').textContent = totalQty;
    document.getElementById('mix-swtotal').textContent = `${totalWeight}kg`;
    document.getElementById('mix-dbtotal').textContent = `${boxCost.toLocaleString()}円`;
  } else {
    pref = document.getElementById('s-pref').value;
    const length = parseInt(document.getElementById('s-length').value);
    const qty = parseInt(document.getElementById('s-qty').value) || 0;
    const danball = DANBALL[length];
    totalWeight = Math.ceil(qty * danball.weight);
    boxCost = qty * danball.box;
    totalQty = qty;
    boxDetail = [`${danball.box}×${qty}`];
    primaryLength = length;
  }

  document.getElementById('s-total-weight').value = totalWeight;

  // 重量帯を求める（切り上げ）
  const maxWeight = SEINO_WEIGHTS[SEINO_WEIGHTS.length - 1];
  let tierIdx = SEINO_WEIGHTS.findIndex(w => w >= totalWeight);
  const overWeight = tierIdx === -1;
  if (overWeight) tierIdx = SEINO_WEIGHTS.length - 1;
  const tierWeight = SEINO_WEIGHTS[tierIdx];
  document.getElementById('s-tier-weight').value = overWeight ? '超過' : tierWeight;

  // 距離帯
  const prefIdx = SEINO_PREF_MAP[pref];
  const distIdx = PREF_TO_DIST[prefIdx];
  const distance = SEINO_DISTANCES[distIdx];

  if (totalWeight <= 0 || totalQty <= 0) {
    document.getElementById('seino-result').innerHTML = '';
    return;
  }

  const isYahoo = seinoChannel === 'yahoo';
  const isTaxIncl = seinoChannel === 'net' || seinoChannel === 'rakuten' || isYahoo;
  const isRakuten = seinoChannel === 'rakuten';
  const isGenba = document.getElementById('s-genba').checked;
  const GENBA_RATE = 25; // 円/kg
  const RAKUTEN_RATE = 1.15;
  const MAX_BUNDLE = 20;

  const channelLabel = isYahoo ? 'ヤフー（税込）' : isRakuten ? '楽天（税込）' : isTaxIncl ? '（税込）' : '（税抜）';

  // ===== Yahoo計算（別ロジック） =====
  if (isYahoo && !mixMode) {
    const length = parseInt(document.getElementById('s-length').value);
    const qty = parseInt(document.getElementById('s-qty').value) || 0;
    if (qty <= 0) { document.getElementById('seino-result').innerHTML = ''; return; }

    const ys = YAHOO_SEINO[pref];
    if (!ys) { document.getElementById('seino-result').innerHTML = '<div class="result-box error-box"><h3>ヤフー送料データなし</h3></div>'; return; }

    const sw = YAHOO_SHIP_WEIGHT[length] || 40;
    const bps = YAHOO_BUNDLE_PER_SET[length] || 1;
    const sets = Math.ceil(qty / bps);
    const totalYW = sw * sets;
    const yahooFee = ys.base + Math.floor(totalYW / 10) * ys.add;
    const perBundle = Math.round(yahooFee / qty);
    const setLabel = bps > 1 ? `${qty}束 → ${sets}セット（1セット${bps}束）` : `${qty}セット`;

    const html = `
      <div class="result-box">
        <h3>ヤフー送料（税込） <span class="info-badge">西濃運輸・比例重量別</span></h3>
        <table class="result-table">
          <tr class="sub"><th>Yahooセット数</th><td>${setLabel}</td></tr>
          <tr class="sub"><th>Yahoo shipWeight</th><td>${sw} × ${sets} = ${totalYW}</td></tr>
          <tr><th>初期送料</th><td>${ys.base.toLocaleString()}円</td></tr>
          <tr><th>追加送料（${Math.floor(totalYW/10)}回 × ${ys.add.toLocaleString()}円）</th><td>${(Math.floor(totalYW/10)*ys.add).toLocaleString()}円</td></tr>
          <tr class="total"><th>合計</th><td>${yahooFee.toLocaleString()}円</td></tr>
          <tr class="sub"><th>1束あたり</th><td>${perBundle.toLocaleString()}円</td></tr>
        </table>
      </div>
    `;
    document.getElementById('seino-result').innerHTML = html;
    return;
  }

  if (isYahoo && mixMode) {
    // 混載Yahoo計算
    const ys = YAHOO_SEINO[pref];
    if (!ys) { document.getElementById('seino-result').innerHTML = '<div class="result-box error-box"><h3>ヤフー送料データなし</h3></div>'; return; }
    let totalYW = 0;
    let yahooDetail = [];
    for (let len = 2; len <= 4; len++) {
      const q = parseInt(document.getElementById(`mix-q${len}`).value) || 0;
      if (q > 0) {
        const sw = YAHOO_SHIP_WEIGHT[len] || 40;
        const bps = YAHOO_BUNDLE_PER_SET[len] || 1;
        const sets = Math.ceil(q / bps);
        totalYW += sw * sets;
        yahooDetail.push(`${len}m:${sw}×${sets}`);
      }
    }
    if (totalQty <= 0) { document.getElementById('seino-result').innerHTML = ''; return; }
    const yahooFee = ys.base + Math.floor(totalYW / 10) * ys.add;
    const perBundle = Math.round(yahooFee / totalQty);

    const html = `
      <div class="result-box">
        <h3>ヤフー送料（税込） <span class="info-badge">西濃運輸・比例重量別</span></h3>
        <table class="result-table">
          <tr class="sub"><th>Yahoo shipWeight合計</th><td>${yahooDetail.join(' + ')} = ${totalYW}</td></tr>
          <tr><th>初期送料</th><td>${ys.base.toLocaleString()}円</td></tr>
          <tr><th>追加送料（${Math.floor(totalYW/10)}回 × ${ys.add}円）</th><td>${(Math.floor(totalYW/10)*ys.add).toLocaleString()}円</td></tr>
          <tr class="total"><th>Yahoo送料合計</th><td>${yahooFee.toLocaleString()}円</td></tr>
          <tr class="sub"><th>1束あたり</th><td>${perBundle.toLocaleString()}円</td></tr>
        </table>
      </div>
    `;
    document.getElementById('seino-result').innerHTML = html;
    return;
  }

  // 20束超の場合は分割計算
  if (totalQty > MAX_BUNDLE && !mixMode) {
    const length = parseInt(document.getElementById('s-length').value);
    const qty = parseInt(document.getElementById('s-qty').value) || 0;
    const danball = DANBALL[length];

    const shipCount = Math.ceil(qty / MAX_BUNDLE);
    const baseQty = Math.floor(qty / shipCount);
    const remainder = qty % shipCount;

    let shipments = [];
    let totalFareSum = 0;
    let totalBoxSum = 0;
    let totalShipWeight = 0;
    let shipRows = '';

    for (let i = 0; i < shipCount; i++) {
      const sq = baseQty + (i < remainder ? 1 : 0);
      const sw = Math.ceil(sq * danball.weight);
      const sbox = sq * danball.box;
      let sTierIdx = SEINO_WEIGHTS.findIndex(w => w >= sw);
      if (sTierIdx === -1) sTierIdx = SEINO_WEIGHTS.length - 1;
      const sFare = SEINO_FARES[sTierIdx][distIdx];
      totalFareSum += sFare;
      totalBoxSum += sbox;
      totalShipWeight += sw;
      shipments.push({ qty: sq, weight: sw, tier: SEINO_WEIGHTS[sTierIdx], fare: sFare, box: sbox });
      shipRows += `<tr><th>便${i+1}: ${sq}束（${sw}kg → ${SEINO_WEIGHTS[sTierIdx]}kg帯）</th><td>運賃 ${sFare.toLocaleString()}円 + ダンボール ${sbox.toLocaleString()}円</td></tr>`;
    }

    const subtotal = totalFareSum + totalBoxSum;
    const tax = isTaxIncl ? Math.round(subtotal * 0.1) : 0;
    const genba = isGenba ? totalShipWeight * GENBA_RATE : 0;
    let totalRaw = subtotal + tax + genba;
    if (isRakuten) totalRaw = Math.round(totalRaw * RAKUTEN_RATE);
    const total = Math.round(totalRaw / 100) * 100;
    const perBundle = Math.round(total / qty);

    document.getElementById('s-total-weight').value = totalWeight;
    document.getElementById('s-tier-weight').value = `${shipCount}便分割`;

    const html = `
      <div class="result-box">
        <h3>西濃運輸 ${channelLabel} <span class="info-badge">⚠ ${shipCount}便分割（1便${MAX_BUNDLE}束上限）</span></h3>
        <table class="result-table">
          <tr class="sub"><th>距離帯</th><td>${distance}km（${pref}）</td></tr>
          ${shipRows}
          <tr><th>運賃合計</th><td>${totalFareSum.toLocaleString()}円</td></tr>
          <tr><th>ダンボール代合計</th><td>${totalBoxSum.toLocaleString()}円</td></tr>
          ${isTaxIncl ? `<tr><th>消費税（10%）</th><td>${tax.toLocaleString()}円</td></tr>` : ''}
          ${isGenba ? `<tr><th>現場渡し（${totalShipWeight}kg×25円）</th><td>${genba.toLocaleString()}円</td></tr>` : ''}
          ${isRakuten ? `<tr><th>楽天手数料（15%）</th><td>×1.15</td></tr>` : ''}
          <tr class="total"><th>合計</th><td>${total.toLocaleString()}円</td></tr>
          <tr class="sub"><th>1束あたり</th><td>${perBundle.toLocaleString()}円</td></tr>
        </table>
        <p class="note">※ ${qty}束 → ${shipments.map(s => s.qty + '束').join(' + ')} に分割。</p>
      </div>
    `;
    document.getElementById('seino-result').innerHTML = html;
    return;
  }

  // 混載で20束超の場合のエラー
  if (totalQty > MAX_BUNDLE && mixMode) {
    document.getElementById('seino-result').innerHTML = `
      <div class="result-box error-box">
        <h3>計算できません</h3>
        <p>合計数量 <strong>${totalQty}束</strong> は1便あたりの上限 <strong>${MAX_BUNDLE}束</strong> を超えています。</p>
        <p>混載モードでは分割計算に対応していません。通常モードで個別に計算してください。</p>
      </div>
    `;
    return;
  }

  // 重量超過エラー
  if (overWeight) {
    document.getElementById('seino-result').innerHTML = `
      <div class="result-box error-box">
        <h3>計算できません</h3>
        <p>合計重量 <strong>${totalWeight.toLocaleString()}kg</strong> は最大重量帯 <strong>${maxWeight.toLocaleString()}kg</strong> を超えています。</p>
        <p>分割配送をご検討ください。</p>
      </div>
    `;
    return;
  }

  // 運賃
  const fare = SEINO_FARES[tierIdx][distIdx];

  // 合計
  const subtotal = fare + boxCost;
  const tax = isTaxIncl ? Math.round(subtotal * 0.1) : 0;
  const genba = isGenba ? totalWeight * GENBA_RATE : 0;
  let totalRaw = subtotal + tax + genba;
  if (isRakuten) totalRaw = Math.round(totalRaw * RAKUTEN_RATE);
  const total = Math.round(totalRaw / 100) * 100;
  const perBundle = totalQty > 0 ? Math.round(total / totalQty) : 0;

  const html = `
    <div class="result-box">
      <h3>西濃運輸 ${channelLabel}</h3>
      <table class="result-table">
        <tr class="sub"><th>距離帯</th><td>${distance}km（${pref}）</td></tr>
        <tr class="sub"><th>適用重量帯</th><td>${tierWeight}kg（実重量 ${totalWeight}kg）</td></tr>
        <tr><th>運賃</th><td>${fare.toLocaleString()}円</td></tr>
        <tr><th>ダンボール代（${boxDetail.join(' + ')}）</th><td>${boxCost.toLocaleString()}円</td></tr>
        ${isTaxIncl ? `<tr><th>消費税（10%）</th><td>${tax.toLocaleString()}円</td></tr>` : ''}
        ${isGenba ? `<tr><th>現場渡し（${totalWeight}kg×25円）</th><td>${genba.toLocaleString()}円</td></tr>` : ''}
        ${isRakuten ? `<tr><th>楽天手数料（15%）</th><td>×1.15</td></tr>` : ''}
        <tr class="total"><th>合計</th><td>${total.toLocaleString()}円</td></tr>
        <tr class="sub"><th>1束あたり</th><td>${perBundle.toLocaleString()}円</td></tr>
      </table>
    </div>
  `;
  document.getElementById('seino-result').innerHTML = html;
}

// 住所入力から都道府県を自動抽出してセレクトに反映
function onAddrInput() {
  const addr = document.getElementById('addr-input').value;
  const m = addr.match(/(北海道|東京都|大阪府|京都府|.{2,3}県)/);
  if (m) {
    const prefFull = m[1];
    const prefShort = prefFull.replace(/[都道府県]$/, '');
    if (SEINO_PREF_MAP[prefShort] !== undefined) {
      document.getElementById('s-pref').value = prefShort;
      document.getElementById('s-pref-mix').value = prefShort;
      calcSeino();
    }
  }
}

// ハーバーサイン距離計算 (km)
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function searchOffice() {
  const addr = document.getElementById('addr-input').value.trim();
  if (!addr) return;

  const resultDiv = document.getElementById('office-result');
  resultDiv.innerHTML = '<p class="searching">検索中...</p>';

  try {
    // 国土地理院APIで住所をジオコーディング
    const url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(addr);
    const resp = await fetch(url);
    const data = await resp.json();

    if (!data.length || !data[0].geometry) {
      resultDiv.innerHTML = '<p class="searching">住所が見つかりませんでした。もう少し詳しく入力してください。</p>';
      return;
    }

    const userLon = data[0].geometry.coordinates[0];
    const userLat = data[0].geometry.coordinates[1];

    // 全営業所との距離を計算
    const ranked = SEINO_OFFICES
      .filter(o => o.lat !== 0)
      .map(o => ({
        ...o,
        dist: haversine(userLat, userLon, o.lat, o.lng)
      }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 3);

    if (!ranked.length) {
      resultDiv.innerHTML = '<p class="searching">営業所データが読み込まれていません。</p>';
      return;
    }

    let html = '<div class="office-list">';
    ranked.forEach((o, i) => {
      const distStr = o.dist < 1 ? `${Math.round(o.dist * 1000)}m` : `${o.dist.toFixed(1)}km`;
      html += `
        <div class="office-item" onclick="selectOffice('${o.p}', this)">
          <span class="office-rank">${i+1}</span>
          <div class="office-info">
            <div class="office-name">${o.n}営業所</div>
            <div class="office-addr">${o.a}</div>
          </div>
          <span class="office-dist">${distStr}</span>
        </div>`;
    });
    html += '</div>';
    resultDiv.innerHTML = html;

    // 自動的に1位の営業所の都道府県を選択
    if (ranked[0]) {
      selectOffice(ranked[0].p, resultDiv.querySelector('.office-item'));
    }
  } catch (e) {
    resultDiv.innerHTML = `<p class="searching">エラー: ${e.message}</p>`;
  }
}

function selectOffice(pref, el) {
  // ハイライト
  document.querySelectorAll('.office-item').forEach(e => e.classList.remove('selected'));
  if (el) el.classList.add('selected');

  // 都道府県をセット
  const prefShort = pref.replace(/[都道府県]$/, '');
  if (SEINO_PREF_MAP[prefShort] !== undefined) {
    document.getElementById('s-pref').value = prefShort;
    document.getElementById('s-pref-mix').value = prefShort;
    calcSeino();
  }
}

// Enterキーで検索
document.getElementById('addr-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchOffice();
});

init();
